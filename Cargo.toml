[workspace]
members = ["py"]
default-members = [".", "py"]

[workspace.package]
version = "0.1.8"
edition = "2024"

[package]
name = "fast5ever"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
description = "WHATWG-compliant HTML parsing, mutation, and serialization for Python, powered by Rust's html5ever"
repository = "https://github.com/AnswerDotAI/fast5ever"
homepage = "https://github.com/AnswerDotAI/fast5ever"
documentation = "https://github.com/AnswerDotAI/fast5ever"
keywords = ["html", "html5", "parser", "dom", "serialization"]
categories = ["parser-implementations", "web-programming"]

[lib]
name = "fast5ever"

[dependencies]
html5ever = "0.39.0"

[lints.clippy]
too_many_arguments = "allow"

[profile.test]
inherits = "release"

[profile.release]
lto = false
codegen-units = 16

[profile.release.package.fast5ever]
incremental = true

[profile.release.package.fast5ever-py]
incremental = true

[profile.dist]
inherits = "release"
lto = true
incremental = false
codegen-units = 1
strip = true

[profile.dist.package.fast5ever]
incremental = false

[profile.dist.package.fast5ever-py]
incremental = false
